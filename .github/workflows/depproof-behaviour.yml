name: depproof-behaviour

# SIMULATION — BEHAVIOUR on this fork's own tests. Runs the suite WITHOUT the recorder, then WITH it, and puts both
# results (pass/fail/skip, failing tests) in the job summary (the recorder must never change what the tests do), then scans with
# the BEHAVIOUR axis and reports to the hub. Separate from depproof.yml, which is untouched. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to test (the corpus pin by default)'
        required: false
        default: 'depproof-pinned'
      scanner-image:
        description: 'Scanner image under test'
        required: false
        default: 'ghcr.io/depproof/depproof:v0.1.25-rc.3'

jobs:
  behaviour:
    permissions:
      contents: read
      security-events: write     # new behaviour reaches the Security tab as SARIF notes
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm clean-install --no-fund
      - run: npm rebuild @louislam/sqlite3
      - run: npm run build

      - id: behaviour
        uses: depproof/depproof-action/behaviour-setup@behaviour-candidate
        with:
          scanner-image: ${{ inputs.scanner-image }}

      - name: Tests WITHOUT the recorder
        id: without
        continue-on-error: true
        env:
          TEST_BACKEND: '1'
        run: |
          start=$(date +%s); set +e
          mkdir -p .depproof-arms && node --test "test/backend-test/**/*.js" 2>&1 | tee .depproof-arms/output.log; test "${PIPESTATUS[0]}" -eq 0
          echo "exit=$?" >> "$GITHUB_OUTPUT"; echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          mkdir -p .depproof-arms/without && { mv .depproof-arms/output.log .depproof-arms/without/output.log; } || true

      - name: Tests WITH the recorder
        id: with
        continue-on-error: true
        env:
          TEST_BACKEND: '1'
          DEPPROOF_BEHAVIOUR_DIR: ${{ steps.behaviour.outputs.dir }}
          NODE_OPTIONS: ${{ steps.behaviour.outputs.node-options }}
        run: |
          start=$(date +%s); set +e
          mkdir -p .depproof-arms && node --test "test/backend-test/**/*.js" 2>&1 | tee .depproof-arms/output.log; test "${PIPESTATUS[0]}" -eq 0
          echo "exit=$?" >> "$GITHUB_OUTPUT"; echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          mkdir -p .depproof-arms/with && { mv .depproof-arms/output.log .depproof-arms/with/output.log; } || true

      - name: Neutrality summary
        if: always()
        env:
          E0: ${{ steps.without.outputs.exit }}
          E1: ${{ steps.with.outputs.exit }}
          T0: ${{ steps.without.outputs.seconds }}
          T1: ${{ steps.with.outputs.seconds }}
          ON: ${{ steps.behaviour.outputs.enabled }}
        run: |
          python3 - <<'PY'
          # Compare what the tests DID in each arm, not only the exit code: a suite that already fails can exit 1
          # both times while different tests fail. JUnit reports give per-test outcomes; node --test gives counts.
          import glob, os, re, xml.etree.ElementTree as ET
          def results(arm):
              d = f".depproof-arms/{arm}"
              tests = {}
              for f in glob.glob(f"{d}/**/*.xml", recursive=True):
                  try: root = ET.parse(f).getroot()
                  except Exception: continue
                  for tc in root.iter("testcase"):
                      tid = f'{tc.get("classname","")}::{tc.get("name","")}'
                      tests[tid] = "failed" if (tc.find("failure") is not None or tc.find("error") is not None) \
                          else "skipped" if tc.find("skipped") is not None else "passed"
              if tests:
                  c = {k: sum(1 for v in tests.values() if v == k) for k in ("passed", "failed", "skipped")}
                  return c, sorted(t for t, v in tests.items() if v == "failed")
              log = f"{d}/output.log"
              if os.path.exists(log):
                  txt = open(log, errors="replace").read()
                  g = lambda k: int((re.findall(rf"^\S*\s*{k} (\d+)\s*$", txt, re.M) or ["0"])[-1])
                  return {"passed": g("pass"), "failed": g("fail"), "skipped": g("skipped")}, None
              return None, None
          c0, f0 = results("without"); c1, f1 = results("with")
          e0, e1, on = os.environ.get("E0"), os.environ.get("E1"), os.environ.get("ON")
          row = lambda c: " | ".join(str(c[k]) for k in ("passed", "failed", "skipped")) if c else "– | – | –"
          same_exit = e0 == e1
          same_counts = c0 is not None and c0 == c1
          same_failures = f0 is None or f0 == f1
          ok = same_exit and same_counts and same_failures
          out = ["### BEHAVIOUR neutrality", "| arm | exit | passed | failed | skipped | seconds |", "|---|---|---|---|---|---|",
                 f"| without recorder | {e0} | {row(c0)} | {os.environ.get('T0')} |",
                 f"| with recorder (enabled={on}) | {e1} | {row(c1)} | {os.environ.get('T1')} |", ""]
          if c0 is None: out.append("**Could not read test results — exit codes only: " + ("same exit code" if same_exit else "EXIT CODE DIFFERS") + "**")
          else: out.append("**NEUTRAL — same exit code, same results" + (", same failing tests" if f0 is not None else "") + "**" if ok else "**DIFFERENCE — investigate**")
          if f0 is not None and f0 != f1:
              out += ["", "Failing only without the recorder: " + (", ".join(sorted(set(f0) - set(f1))) or "none"),
                      "Failing only with the recorder: " + (", ".join(sorted(set(f1) - set(f0))) or "none")]
          if f0: out += ["", f"<details><summary>{len(f0)} test(s) failing in both arms</summary>", ""] + [f"- `{t}`" for t in f0] + ["", "</details>"]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(out) + "\n")
          PY

      - uses: depproof/depproof-action@behaviour-candidate
        if: always()
        with:
          scanner-image: ${{ inputs.scanner-image }}
          discover: 'true'
          fail-on: none
          sarif: 'true'
          behaviour-from: ${{ steps.behaviour.outputs.from }}
          report-to: ${{ secrets.DEPPROOF_HUB_URL }}
          report-token: ${{ secrets.DEPPROOF_REPORT_TOKEN }}
          pr-comment: 'false'
