# OVERHEAD measurement — npm-uptime-kuma. RESEARCH, TEMPORARY (2026-09-14).
#
# Installed by depproof-research/behaviour/ci/overhead-install.sh (embeds the runner and the Node
# behaviour recorder as base64). Remove with `overhead-install.sh --remove` if not pursued; removal leaves
# the file in this private fork's git history.
#
# Arms: A-none · B-loaded (NODE_V8_COVERAGE, today's LOADED method) · C-behaviour (+ the Node recorder).
# Caveat carried into the reading: some of this suite's tests reach real internet hosts (tcp-ping to
# smtp.gmail.com, expired.badssl.com), which adds network noise to every arm alike.

name: Overhead — uptime-kuma

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to measure (the corpus pin by default)
        required: false
        default: 'depproof-pinned'
      pairs:
        description: Paired repetitions of every arm
        required: false
        default: '3'
      recorder:
        description: Recorder version fingerprint (set by overhead-install.sh)
        required: false
        default: 'unknown'

permissions:
  contents: read

jobs:
  overhead:
    runs-on: ubuntu-22.04         # declared by the repo's own matrix
    timeout-minutes: 240
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm clean-install --no-fund
      - run: npm rebuild @louislam/sqlite3
      - run: npm run build

      - name: Write the measurement harness
        run: |
          mkdir -p .github/depproof
          echo '' | base64 -d > .github/depproof/overhead-run.py
          echo '' | base64 -d > .github/depproof/node-behaviour.cjs
          cat > .github/depproof/arms.json <<'JSON'
          [
            {"name": "A-none", "cmd": "node --test \"test/backend-test/**/*.js\"",
             "env": {"TEST_BACKEND": "1"}},
            {"name": "B-loaded", "cmd": "node --test \"test/backend-test/**/*.js\"",
             "env": {"TEST_BACKEND": "1", "NODE_V8_COVERAGE": "{TRACE}/v8"}},
            {"name": "C-behaviour", "cmd": "node --test \"test/backend-test/**/*.js\"",
             "env": {"TEST_BACKEND": "1", "NODE_V8_COVERAGE": "{TRACE}/v8",
                     "NODE_OPTIONS": "--require {WS}/.github/depproof/node-behaviour.cjs",
                     "DEPPROOF_BEHAVIOUR_DIR": "{TRACE}/behaviour", "DEPPROOF_PROJECT_ROOT": "{WS}"}}
          ]
          JSON

      - name: Measure (${{ inputs.pairs }} pairs + 1 warm-up)
        env:
          RECORDER_VERSION: ${{ inputs.recorder }}
        run: python3 .github/depproof/overhead-run.py .github/depproof/arms.json "${{ inputs.pairs }}" overhead "${{ github.run_id }}" 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overhead-uptime-kuma
          path: |
            overhead/results.tsv
            overhead/summary.txt
            overhead/logs/
          retention-days: 14
